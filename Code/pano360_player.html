<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360 Panorama Player</title>
<!--
  360 全景播放器

  为什么有这么一个页面：
    `.OSV` 是两路 4K HEVC Main10 鱼眼，浏览器**解不了**；而且就算能解，
    拿到的也是两张圆图 —— 重投影必须有人做。
    所以走"**先转码、随点随放**"（用户定的 A 方案）：
      · 后端 `/api/pano360/transcode` 把 `.OSV` 转成等距柱状 H.264（转一次，缓存）
      · 后端 `/pano` 用 HTTP Range 流式送出（`<video>` 拖进度要用）
      · 这个页面负责播放 + **拖拽转向**

  转向怎么做：等距柱状视频是"整张球面摊平"，所以看某个方向 = 从这张图里
  按 yaw/pitch/fov 裁一块透视投影出来。用 canvas 逐像素做反向映射即可，
  不需要 WebGL（2048×1024 的源，取景窗口通常 960×540 左右，性能够）。

  用法：
    /pano360_player.html?name=<项目>&rel=<素材相对路径>&tier=full&t=<秒>
-->
<style>
  :root{--bg:#0b1220;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--fg:#e8eefc;--dim:#9db0d0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  #wrap{position:relative;width:100%;height:100%;overflow:hidden}
  /* 隐藏原生 video：画面从它取帧画到 canvas 上 */
  #src{position:absolute;left:-10000px;top:0;width:640px;height:320px}
  #view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;
    background:#000}
  #view.drag{cursor:grabbing}
  .hud{position:absolute;z-index:5;background:rgba(12,20,36,.72);
    border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px)}
  #top{left:12px;top:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #top b{font-weight:600}
  .dim{color:var(--dim)}
  #msg .bar{margin-top:9px;height:6px;border-radius:999px;background:rgba(255,255,255,.16);
    overflow:hidden}
  #msg .bar i{display:block;height:100%;width:0;background:#38bdf8;
    transition:width .35s ease}
  #msg .bar.indeterminate i{width:35%;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  #bottom{left:50%;transform:translateX(-50%);bottom:14px;padding:10px 14px;
    display:flex;gap:12px;align-items:center;min-width:min(720px,94vw)}
  button{background:rgba(255,255,255,.10);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
  button:hover{background:rgba(255,255,255,.18)}
  button:disabled{opacity:.4;cursor:default}
  #seek{flex:1 1 auto;min-width:120px}
  #msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;
    padding:16px 22px;text-align:center;max-width:min(560px,90vw);line-height:1.7}
  #msg b{display:block;margin-bottom:6px}
  .err{color:#ffb4b4}
  label{display:inline-flex;gap:6px;align-items:center}
  select{background:rgba(255,255,255,.10);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:5px 8px;font:inherit}
  #time{font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <video id="src" playsinline preload="auto"></video>
  <canvas id="view"></canvas>

  <div class="hud" id="top">
    <b id="title">360</b>
    <span class="dim" id="planes">…</span>
  </div>

  <div class="hud" id="bottom">
    <button id="play" type="button" title="Play / pause (Space)">▶</button>
    <span id="time">0:00.0</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" title="Seek">
    <label class="dim">FOV
      <select id="fov">
        <option value="60">60°</option>
        <option value="75" selected>75°</option>
        <option value="90">90°</option>
        <option value="110">110°</option>
      </select>
    </label>
    <!-- 档位已去掉：固定用「原图级」（等距柱状 6912×3456，与 3840 鱼眼同密度）。
         用户 2026-10-22：「2048不够清晰、4096如果不是原图级别，那也没必要保留，
         只保留原图的清晰度即可」。旧链接若带 ?tier=full/sharp 仍会被尊重。 -->
    <button id="reset" type="button" title="Reset view (R)">Reset</button>
  </div>

  <div class="hud" id="msg">
    <b id="msgTitle">Loading…</b><span id="msgBody"></span>
    <div id="bar" class="bar" style="display:none"><i id="barFill"></i></div>
  </div>
</div>

<script>
'use strict';

// ---------------- 参数 ----------------
const Q = new URLSearchParams(location.search);
const NAME = Q.get('name') || '';
const REL  = Q.get('rel')  || '';
let   TIER = Q.get('tier') || 'native';
const T0   = Number(Q.get('t') || 0);

const src    = document.getElementById('src');
const view   = document.getElementById('view');
const ctx    = view.getContext('2d');
const msg    = document.getElementById('msg');
const msgT   = document.getElementById('msgTitle');
const msgB   = document.getElementById('msgBody');
const btnPlay= document.getElementById('play');
const seek   = document.getElementById('seek');
const timeEl = document.getElementById('time');
const fovSel = document.getElementById('fov');
const planes = document.getElementById('planes');

let yaw = Number(Q.get('yaw') || 0);      // 度；0 = 画面中心
let pitch = Number(Q.get('pitch') || 0);  // 度；正=抬头
let fov = Number(fovSel.value);
let dragging = false, lastX = 0, lastY = 0;
let ready = false;
let rafId = 0;

// ---------------- 两种模式 ----------------
//   video 模式（默认）：`.OSV` -> 转码 -> <video> 播放（可拖拽转向）
//   photo 模式（?path=...）：**全景照片**（2:1 等距柱状 JPEG）-> <img> + 同一套透视取景
//
// 为什么要 photo 模式：DJI 的全景照片是 15520×7760 的等距柱状图。
// 以前它们被当成普通照片塞进照片图层，缩略图就是一张**被拉扁的球面展开图**，
// 根本看不出是什么。加了这条之后就能像看 360 视频一样拖拽着看。
//
// 复用同一份透视代码：源从 video 换成 img，其余（拖拽/滚轮/键盘/取景）完全一致。
let PHOTO_MODE = false;
let img = null;
const PHOTO_MAX_W = 4096;   // 源图先缩到这个宽度再逐像素取，避免 480 MB 的 canvas

document.getElementById('title').textContent =
  (REL.split(/[\\/]/).pop() || '360').replace(/\.osv$/i, '');

function say(title, body, isErr){
  msg.style.display = 'block';
  msgT.textContent = title;
  msgT.className = isErr ? 'err' : '';
  msgB.textContent = body || '';
}
function hideMsg(){ msg.style.display = 'none'; }

// ---------------- 画布尺寸（按设备像素比，避免糊） ----------------
function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width  = Math.max(1, Math.round(view.clientWidth  * dpr));
  view.height = Math.max(1, Math.round(view.clientHeight * dpr));
}
window.addEventListener('resize', fit);
fit();

// ---------------- 透视取景 ----------------
// 等距柱状图上的像素 <-> 方向：
//   经度 lon = (u / W) * 360 - 180      （u 为列）
//   纬度 lat = 90 - (v / H) * 180       （v 为行）
//   u = (lon + 180) / 360 * W ,  v = (90 - lat) / 180 * H
//
// 取景：对输出画面的每个像素，先算出它在相机坐标系下的方向，
// 再用 yaw/pitch 转到世界方向，最后落到等距柱状图的 (u,v) 采样。
function draw(){
  rafId = 0;
  // 源可以是 <video>（360 视频）或 <img>（360 全景照片）。
  //
  // 照片模式下源图是 15520×7760 = 1.2 亿像素，直接建这个尺寸的 canvas 要 ~480 MB，
  // 所以先缩到 PHOTO_MAX_W 再逐像素取 —— 与视频那条路完全同一套透视代码。
  let W, H, srcEl;
  if (PHOTO_MODE){
    if (!ready || !img.naturalWidth) return;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    W = Math.min(PHOTO_MAX_W, nw);
    H = Math.max(1, Math.round(nh * W / nw));
    srcEl = img;
  }else{
    if (!ready || !src.videoWidth) return;
    W = src.videoWidth; H = src.videoHeight; srcEl = src;
  }
  const cw = view.width, ch = view.height;

  // 用 drawImage 逐列采样太慢，所以：把源一次性缩放到一个中间 ImageBitmap，
  // 然后逐像素从它的 ImageData 取 —— 2048 宽的源，ImageData 是 2048*1024*4 = 8 MB，
  // 每帧取一次可以接受（且只在需要时重取）。
  const srcCanvas = draw._sc || (draw._sc = document.createElement('canvas'));
  if (srcCanvas.width !== W || srcCanvas.height !== H){
    srcCanvas.width = W; srcCanvas.height = H;
    draw._sctx = srcCanvas.getContext('2d', { willReadFrequently: true });
  }
  const sctx = draw._sctx;
  sctx.drawImage(srcEl, 0, 0, W, H);
  const sd = sctx.getImageData(0, 0, W, H).data;

  const out = ctx.createImageData(cw, ch);
  const od = out.data;

  const f = fov * Math.PI / 180;
  const tanHalf = Math.tan(f / 2);
  const aspect = cw / ch;
  const yawR = yaw * Math.PI / 180, pitchR = pitch * Math.PI / 180;
  const sy = Math.sin(pitchR), cy = Math.cos(pitchR);
  const sz = Math.sin(yawR), cz = Math.cos(yawR);

  for (let j = 0; j < ch; j++){
    // 相机坐标：中心 -1..1，正=上
    const ny = (1 - 2 * (j + 0.5) / ch) * tanHalf;
    for (let i = 0; i < cw; i++){
      const nx = (2 * (i + 0.5) / cw - 1) * tanHalf * aspect;
      // 方向（相机系，z 轴向前）
      let dx = nx, dy = ny, dz = 1;
      const inv = 1 / Math.hypot(dx, dy, dz);
      dx *= inv; dy *= inv; dz *= inv;
      // pitch（绕 x 轴）
      const dy2 = dy * cy + dz * sy;
      const dz2 = -dy * sy + dz * cy;
      // yaw（绕 y 轴）
      const dx3 = dx * cz + dz2 * sz;
      const dz3 = -dx * sz + dz2 * cz;
      const dy3 = dy2;
      // 世界方向 -> 经纬度 -> 等距柱状像素
      const lat = Math.asin(Math.max(-1, Math.min(1, dy3)));
      const lon = Math.atan2(dx3, dz3);
      let u = (lon / (2 * Math.PI) + 0.5) * W;
      let v = (0.5 - lat / Math.PI) * H;
      if (u < 0) u += W; if (u >= W) u -= W;
      const ui = u | 0, vi = v | 0;
      const o = (j * cw + i) * 4;
      if (vi < 0 || vi >= H){ od[o+3] = 255; continue; }
      const s = (vi * W + ui) * 4;
      od[o] = sd[s]; od[o+1] = sd[s+1]; od[o+2] = sd[s+2]; od[o+3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
}

function requestDraw(){
  if (rafId) return;
  rafId = requestAnimationFrame(draw);
}

// ---------------- 交互：拖拽转向 ----------------
view.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  view.classList.add('drag');
  view.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', e => {
  if (!dragging) return;
  // 每像素转多少度：与当前 FOV 成比例 —— 视野越窄，同样的拖动转得越少（手感一致）
  const perPx = fov / view.clientHeight;
  yaw   -= (e.clientX - lastX) * perPx;
  pitch += (e.clientY - lastY) * perPx;
  pitch = Math.max(-89, Math.min(89, pitch));
  if (yaw > 180) yaw -= 360; if (yaw < -180) yaw += 360;
  lastX = e.clientX; lastY = e.clientY;
  requestDraw();
});
function endDrag(e){
  if (!dragging) return;
  dragging = false; view.classList.remove('drag');
  try { view.releasePointerCapture(e.pointerId); } catch (_) {}
}
view.addEventListener('pointerup', endDrag);
view.addEventListener('pointercancel', endDrag);

// 滚轮缩放 FOV
view.addEventListener('wheel', e => {
  e.preventDefault();
  fov = Math.max(25, Math.min(140, fov * (e.deltaY > 0 ? 1.08 : 1/1.08)));
  const near = [...fovSel.options].map(o => Number(o.value));
  const best = near.reduce((a, b) => Math.abs(b - fov) < Math.abs(a - fov) ? b : a);
  fovSel.value = String(best);
  requestDraw();
}, { passive: false });

// ------------- 键盘 -------------
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R'){ yaw = 0; pitch = 0; requestDraw(); }
  else if (e.key === 'ArrowLeft'){ yaw -= 5; requestDraw(); }
  else if (e.key === 'ArrowRight'){ yaw += 5; requestDraw(); }
  else if (e.key === 'ArrowUp'){ pitch = Math.min(89, pitch + 5); requestDraw(); }
  else if (e.key === 'ArrowDown'){ pitch = Math.max(-89, pitch - 5); requestDraw(); }
});

// ---------------- 播放控制 ----------------
function togglePlay(){
  if (!ready) return;
  if (src.paused) src.play().catch(() => {}); else src.pause();
}
btnPlay.addEventListener('click', togglePlay);
src.addEventListener('play',  () => { btnPlay.textContent = '❚❚'; });
src.addEventListener('pause', () => { btnPlay.textContent = '▶'; });

src.addEventListener('timeupdate', () => {
  if (!src.duration) return;
  seek.value = String(Math.round(src.currentTime / src.duration * 1000));
  timeEl.textContent = fmt(src.currentTime);
});
seek.addEventListener('input', () => {
  if (!src.duration) return;
  src.currentTime = Number(seek.value) / 1000 * src.duration;
});

fovSel.addEventListener('change', () => { fov = Number(fovSel.value); requestDraw(); });

// 档位切换：重新走一遍 boot()（会先查缓存/转码，再加载新档位的视频）
const tierSel = document.getElementById('tier');
if (tierSel) {
  tierSel.value = TIER;
  tierSel.addEventListener('change', () => {
    TIER = tierSel.value;
    ready = false;
    planes.textContent = '…';
    say('切换清晰度…', '标准档是 2048 宽、清晰档是 4096 宽。清晰档第一次要重转一次（分钟级），转完自动播。');
    boot();
  });
}
document.getElementById('reset').addEventListener('click', () => {
  yaw = 0; pitch = 0; fov = Number(fovSel.value); requestDraw();
});

function fmt(t){
  if (!Number.isFinite(t)) return '0:00.0';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}

// 每帧（暂停时也要能转视角，所以拖拽时单独 requestDraw）
function loop(){
  if (!src.paused) requestDraw();
  requestAnimationFrame(loop);
}

// ---------------- 启动 ----------------
async function boot(){
  // ---- 全景照片模式：直接拿原图，不转码 ----
  // `/photo?path=` 已经是现成的接口（会校验路径在项目文件夹内）。
  const PHOTO_PATH = Q.get('path') || '';
  if (PHOTO_PATH){
    PHOTO_MODE = true;
    // 视频控件对照片没意义（播放/进度条/时间）
    [btnPlay, seek, timeEl].forEach(el=>{ if(el) el.style.display='none'; });
    document.getElementById('title').textContent =
      (PHOTO_PATH.split(/[\\/]/).pop() || '360 photo');
    say('加载全景照片…', '全景照片是 2:1 等距柱状图，加载后可以拖拽转向。');
    img = new Image();
    img.onload = () => {
      ready = true;
      planes.textContent = img.naturalWidth + '×' + img.naturalHeight +
        '  ·  ' + Math.round(img.naturalWidth / img.naturalHeight) + ':1 等距柱状';
      hideMsg();
      requestDraw();
    };
    img.onerror = () => say('照片加载失败', '取不到这张图：' + PHOTO_PATH, true);
    img.src = '/photo?path=' + encodeURIComponent(PHOTO_PATH);
    return;
  }

  if (!NAME || !REL){
    say('缺少参数', '需要 ?name=<项目>&rel=<素材路径>，或者 ?path=<全景照片路径>', true);
    return;
  }
  // ---- 第一步：挑一个"能立刻播"的版本，同时后台转原图级 ----
  //
  // 为什么不再"没转完就干等"：
  //   原图级（6912×3456）实测 10 秒素材要 197 秒，一段 10 分钟素材 ≈ 33 分钟。
  //   而项目里通常已经有 sharp/full 的缓存 —— 先用它秒开，
  //   原图级转好之后自动换上去（保持当前时间与视角），体验上就是"先能看、后变清"。
  try{
    const nat = await probeTier('native');
    if (nat.cached){
      playTier = 'native';
      EQUI_RES = nat.size ? (Math.round(nat.size / 1048576) + ' MB') : '';
      loadTier('native', '已缓存');
      return;
    }
    // 找一个已缓存的档位先播（从好到差）
    for (const t of ['sharp', 'full', 'medium', 'fast', 'quick']){
      const p = await probeTier(t);
      if (p.cached){
        playTier = t;
        EQUI_RES = p.size ? (Math.round(p.size / 1048576) + ' MB') : '';
        break;
      }
    }
    // 起原图级任务（后台跑）
    const sub = await startTier('native');
    if (!sub.job) throw new Error('接口没返回 job id');
    nativeJob = sub.job;

    if (!playTier){
      // 一个能播的都没有 → 只能等原图级
      say('正在转原图级…', '这个素材还没转过。原图级是分钟到半小时级的（转一次以后就是秒开）。');
      showBar(0);
      await pollJob(nativeJob, '正在转原图级');
      nativeJob = null;
      playTier = 'native';
      loadTier('native', '刚转好');
      return;
    }
    // 有缓存 → 先播，后台继续转
    loadTier(playTier, '已缓存');
    say('正在播放「' + TIER_LABEL[playTier] + '」，原图级后台转码中…',
        '转完会自动切到原图级，不用刷新。左下角的进度就是它。');
    showBar(0);
    pollNativeInBackground();
  }catch(e){
    say('转码失败', String(e.message || e), true);
    hideBar();
  }
}

// ---------------- 档位探测 / 加载 / 后台升级 ----------------
const TIER_LABEL = {
  native: '原图 6912', sharp: '清晰 4096', full: '标准 2048',
  medium: '中档 1536', fast: '快档 1536', quick: '很快 1280',
};

let playTier = null;       // 现在正在播的档位
let nativeJob = null;      // 后台原图级任务 id

async function probeTier(tier){
  const r = await fetch('/api/pano360/transcode?name=' + encodeURIComponent(NAME) +
    '&rel=' + encodeURIComponent(REL) + '&tier=' + encodeURIComponent(tier) + '&probe=1');
  const j = await r.json();
  if (!r.ok || !j.success) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function startTier(tier){
  const r = await fetch('/api/pano360/transcode?name=' + encodeURIComponent(NAME) +
    '&rel=' + encodeURIComponent(REL) + '&tier=' + encodeURIComponent(tier));
  const j = await r.json();
  if (!r.ok || !j.success) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// 载入某个档位的视频；keepTime 时保留当前播放位置（升级切换用）
function loadTier(tier, note, keepTime){
  const url = '/pano?name=' + encodeURIComponent(NAME) +
              '&rel=' + encodeURIComponent(REL) + '&tier=' + encodeURIComponent(tier);
  // 左下角信息：分辨率体积 + 这是哪一档
  if (planes) planes.textContent = (EQUI_RES || '') + '  ·  ' + (TIER_LABEL[tier] || tier) + (note ? '（' + note + '）' : '');
  const at = keepTime ? src.currentTime : 0;
  const wasPlaying = keepTime && !src.paused;
  say('加载视频…', '正在读取「' + (TIER_LABEL[tier] || tier) + '」的全景视频。');
  showBar(null);
  src.addEventListener('loadedmetadata', () => {
    ready = true;
    hideBar();
    if (at > 0) src.currentTime = at;
    if (wasPlaying) { try{ src.play() }catch(e){} }
    if (!keepTime && T0 > 0) src.currentTime = T0;
    hideMsg();
    requestDraw();
    loop();
  }, { once: true });
  src.addEventListener('error', () => {
    say('视频加载失败', '原始错误：' + (src.error && src.error.message || 'unknown'), true);
  });
  src.src = url;
  src.load();
}

// 后台轮询原图级任务：进度显示在左下角，转完自动切过去
async function pollNativeInBackground(){
  const t0 = Date.now();
  for(;;){
    await new Promise(r => setTimeout(r, 2000));
    let j;
    try{
      const r = await fetch('/api/pano360/job?id=' + encodeURIComponent(nativeJob));
      const d = await r.json();
      if (!r.ok || !d.success) continue;
      j = d.job;
    }catch(e){ continue; }
    if (!j) continue;
    if (j.state === 'done'){
      nativeJob = null;
      EQUI_RES = j.size ? (Math.round(j.size / 1048576) + ' MB') : '';
      playTier = 'native';
      say('已切到原图级', '原图级转码完成，正在替换画面（保持当前时间与视角）。');
      loadTier('native', '原图级', true);
      return;
    }
    if (j.state === 'failed'){
      nativeJob = null;
      hideBar();
      planes.textContent = '原图级转码失败（继续用 ' + (TIER_LABEL[playTier] || playTier) + '）';
      return;
    }
    if (j.percent != null){
      showBar(j.percent);
      planes.textContent = '原图级后台转码 ' + Math.round(j.percent) + '%';
    }
    if (Date.now() - t0 > 6 * 3600 * 1000) return;   // 安全阀
  }
}

let EQUI_RES = '';

// ---------------- 进度条 ----------------
// 转码是分钟级的（原图级更久），只有文字百分比看不到"还剩多少"，
// 所以给一条实心进度条；视频本身在缓冲时用不确定态（来回滑动）。
const barEl  = document.getElementById('bar');
const barFill = document.getElementById('barFill');

function showBar(pct){
  if (!barEl || !barFill) return;
  barEl.style.display = 'block';
  if (pct == null){
    barEl.classList.add('indeterminate');
    barFill.style.width = '';
  }else{
    barEl.classList.remove('indeterminate');
    barFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
}
function hideBar(){
  if (barEl) barEl.style.display = 'none';
}

// 轮询转码进度，直到 done / failed。
// 为什么轮询而不是长连接：同步接口会把请求挂住分钟级，容易被浏览器或代理掐掉；
// 而且用户看不到任何进度，只能干等。
async function pollJob(jobId, title){
  const title0 = title || '正在转码';
  const t0 = Date.now();
  let lastPct = -1;
  for(;;){
    await new Promise(r => setTimeout(r, 1500));
    let j;
    try{
      const r = await fetch('/api/pano360/job?id=' + encodeURIComponent(jobId));
      j = (await r.json());
      if (!r.ok || !j.success) throw new Error(j.error || ('HTTP ' + r.status));
      j = j.job;
    }catch(e){
      // 轮询偶发失败不该中断转码（后台还在跑），继续试
      continue;
    }
    if (j.state === 'done'){
      EQUI_RES = j.size ? (Math.round(j.size / 1048576) + ' MB') : '';
      showBar(100);
      return;
    }
    if (j.state === 'failed'){
      hideBar();
      throw new Error((j.error || 'unknown').slice(-300));
    }
    const pct = (j.percent == null) ? null : Math.round(j.percent);
    const el = Math.round((Date.now() - t0) / 1000);
    if (pct != null) showBar(pct);
    if (pct !== lastPct){
      lastPct = pct;
      const parts = [];
      if (pct != null) parts.push(pct + '%');
      if (j.seconds_done != null) parts.push('已处理 ' + j.seconds_done + ' s');
      if (j.speed) parts.push('速度 ' + j.speed);
      parts.push('已等 ' + el + ' s');
      say(title0 + '… ' + (pct != null ? pct + '%' : ''),
          parts.join('  ·  ') + '\n（转一次以后这个素材就是秒开）');
    }
    // 安全阀：超过 2 小时就放弃，避免无限轮询
    if (Date.now() - t0 > 2 * 3600 * 1000) throw new Error('转码超时（>2 小时）');
  }
}

boot();
</script>
