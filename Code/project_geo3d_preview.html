<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Track Preview</title>

<link rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css">

<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Microsoft YaHei",
        "Segoe UI",
        sans-serif;
    background: #f3f6f9;
    color: #142033;
}

.header {
    height: 72px;
    background: #1f2937;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 34px;
    font-size: 28px;
    font-weight: 700;
}

.page {
    padding: 24px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
}

h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

.description {
    color: #64748b;
    font-size: 18px;
    margin-bottom: 24px;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

select {
    width: 100%;
    height: 52px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 17px;
    background: white;
}

.notice {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #047857;
}

.notice.error {
    background: #fef2f2;
    border-color: #fecaca;
    color: #b91c1c;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #e8eef8;
    color: #1d4ed8;
}

button:disabled {
    opacity: .55;
    cursor: default;
}

.file-list {
    display: grid;
    gap: 10px;
}

.file-item {
    border: 1px solid #dbe4ef;
    border-radius: 12px;
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}

.file-item.active {
    border-color: #2563eb;
    background: #eff6ff;
}

.file-name {
    font-weight: 700;
    font-size: 17px;
}

.file-meta {
    margin-top: 5px;
    color: #64748b;
    font-size: 14px;
}

#cesiumContainer {
    width: 100%;
    height: 700px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
}

.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
}

.stat {
    min-width: 150px;
    border: 1px solid #dbe4ef;
    border-radius: 10px;
    padding: 12px 16px;
}

.stat-title {
    color: #64748b;
    font-size: 14px;
}

.stat-value {
    margin-top: 4px;
    font-size: 22px;
    font-weight: 700;
}

.info-panel {
    position: absolute;
    right: 18px;
    top: 18px;
    width: 300px;
    max-height: calc(100% - 36px);
    overflow: auto;
    background: rgba(255,255,255,.95);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 6px 22px rgba(0,0,0,.18);
    z-index: 10;
}

.info-title {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 10px;
}

.info-row {
    padding: 5px 0;
    color: #475569;
    font-size: 14px;
}

.info-row b {
    color: #0f172a;
}

.hint {
    margin-top: 12px;
    color: #64748b;
    font-size: 14px;
}

.video-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.68);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
}

.video-dialog {
    width: min(1100px, 92vw);
    max-height: 92vh;
    background: #0f172a;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
}

.video-dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 16px;
    color: white;
}

.video-title {
    font-weight: 700;
}

.video-info {
    margin-top: 4px;
    color: #cbd5e1;
    font-size: 13px;
}

.video-close {
    border: 0;
    background: transparent;
    color: white;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 8px;
}

#videoPlayer {
    display: block;
    width: 100%;
    max-height: 72vh;
    background: black;
}

.video-status {
    padding: 9px 16px 12px;
    color: #cbd5e1;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="header">
    Drone Survey Data
</div>

<div class="page">

    <div class="card">
        <h1>3D track preview</h1>
        <div class="description">
            Reads altitude from the DJI time-position data and shows the actual flight path in 3D.
        </div>

        <label for="projectSelect">Select project</label>
        <select id="projectSelect"></select>

        <div id="projectNotice"
             class="notice"
             style="display:none"></div>
    </div>

    <div class="card">

        <div class="toolbar">
            <button id="refreshBtn"
                    class="secondary">
                Rescan
            </button>

            <button id="loadAllBtn"
                    class="primary">
                Load all 3D tracks
            </button>

            <button id="clearBtn"
                    class="secondary">
                Clear map
            </button>
        </div>

        <div id="fileNotice"
             class="notice"
             style="display:none"></div>

        <div id="fileList"
             class="file-list"></div>

    </div>

    <div class="card">

        <div class="stats"
             id="stats"></div>

        <div id="mapNotice"
             class="notice"
             style="display:none"></div>

        <div id="cesiumContainer">

            <div id="infoPanel"
                 class="info-panel"
                 style="display:none">
            </div>

        </div>

        <div class="hint">
            Drag with the left button to rotate, right button to pan, wheel to zoom.
            Click a 3D track to locate the matching video time and play it.
        </div>

    </div>

</div>


<div id="videoModal" class="video-modal">
    <div class="video-dialog">
        <div class="video-dialog-head">
            <div>
                <div id="videoTitle" class="video-title">Video player</div>
                <div id="videoInfo" class="video-info"></div>
            </div>
            <button id="videoClose" class="video-close" type="button">×</button>
        </div>
        <video id="videoPlayer" controls preload="metadata"></video>
        <div id="videoStatus" class="video-status"></div>
    </div>
</div>

<script>
const projectSelect =
    document.getElementById("projectSelect");

const projectNotice =
    document.getElementById("projectNotice");

const fileNotice =
    document.getElementById("fileNotice");

const mapNotice =
    document.getElementById("mapNotice");

const fileList =
    document.getElementById("fileList");

const stats =
    document.getElementById("stats");

const infoPanel =
    document.getElementById("infoPanel");

const loadAllBtn =
    document.getElementById("loadAllBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const clearBtn =
    document.getElementById("clearBtn");

const videoModal =
    document.getElementById("videoModal");

const videoPlayer =
    document.getElementById("videoPlayer");

const videoTitle =
    document.getElementById("videoTitle");

const videoInfo =
    document.getElementById("videoInfo");

const videoStatus =
    document.getElementById("videoStatus");

const videoClose =
    document.getElementById("videoClose");

let viewer = null;
let entities = [];
let geoFiles = [];

function show(el, msg, error=false) {
    el.textContent = msg;
    el.className =
        error
            ? "notice error"
            : "notice";
    el.style.display = "block";
}

function hide(el) {
    el.style.display = "none";
}

function esc(value) {
    return String(value ?? "")
        .replace(/[&<>"']/g, m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m]));
}

function formatTime(sec) {

    sec = Number(sec);

    if (!Number.isFinite(sec)) {
        return "-";
    }

    const h =
        Math.floor(sec / 3600);

    const m =
        Math.floor((sec % 3600) / 60);

    const s =
        (sec % 60)
        .toFixed(3)
        .padStart(6, "0");

    if (h > 0) {
        return (
            String(h).padStart(2, "0")
            + ":"
            + String(m).padStart(2, "0")
            + ":"
            + s
        );
    }

    return (
        String(m).padStart(2, "0")
        + ":"
        + s
    );
}

async function api(url) {

    const response =
        await fetch(url);

    const data =
        await response.json();

    if (!response.ok || data.error) {
        throw new Error(
            data.error ||
            ("Request failed: " + response.status)
        );
    }

    return data;
}

function closeVideo() {

    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.load();
    videoModal.style.display = "none";
    videoStatus.textContent = "";
}

function openVideoAt(
    entity,
    pointIndex,
    pointTime,
    latitude,
    longitude,
    height
) {

    const p = entity.properties;

    const get =
        key => {
            const value = p?.[key];
            if (value && typeof value.get === "function") {
                return value.get(Cesium.JulianDate.now());
            }
            return value;
        };

    const video = String(get("video") || "");
    const folderIndex = Number(get("folder_index"));
    const videoPath = String(get("video_path") || "");
    const segment = get("segment_index");
    const segmentEnd = Number(get("video_end"));

    if (!video || !videoPath || !Number.isFinite(folderIndex)) {
        show(mapNotice, "Could not determine the matching video file.", true);
        return;
    }

    const query = new URLSearchParams({
        name: projectSelect.value,
        folder_index: String(folderIndex),
        path: videoPath
    });

    videoTitle.textContent = video;
    videoInfo.textContent =
        "Segment " + String(segment)
        + " · clicked at " + formatTime(pointTime)
        + " · altitude " + Number(height).toFixed(2) + " m";

    videoStatus.textContent =
        "Locating " + formatTime(pointTime)
        + ", playing to the end of the segment " + formatTime(segmentEnd);

    videoModal.style.display = "flex";

    videoPlayer.pause();
    videoPlayer.src = "/api/project/video?" + query.toString();

    const seekAndPlay = () => {
        const target = Math.max(0, Number(pointTime) || 0);
        const end = Number(segmentEnd);

        try {
            videoPlayer.currentTime = target;
        } catch (error) {
            videoStatus.textContent = "Video opened, waiting to seek…";
        }

        const playPromise = videoPlayer.play();
        if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(() => {
                videoStatus.textContent =
                    "Video positioned at " + formatTime(target) + " — press play.";
            });
        }

        const onTimeUpdate = () => {
            if (Number.isFinite(end) && videoPlayer.currentTime >= end) {
                videoPlayer.pause();
                videoPlayer.removeEventListener("timeupdate", onTimeUpdate);
                videoStatus.textContent =
                    "Played to the end of the segment " + formatTime(end);
            }
        };

        videoPlayer.addEventListener("timeupdate", onTimeUpdate);
    };

    videoPlayer.addEventListener(
        "loadedmetadata",
        seekAndPlay,
        { once: true }
    );
}

function handleTrajectoryClick(movement) {

    const picked = viewer.scene.pick(movement.position);

    if (!Cesium.defined(picked) || !picked.id || !picked.id.properties) {
        return;
    }

    const entity = picked.id;
    const positions =
        entity.polyline?.positions?.getValue(
            Cesium.JulianDate.now()
        );

    if (!positions || !positions.length) {
        return;
    }

    const pointTimesValue = entity.properties.point_times;
    let pointTimes = pointTimesValue && typeof pointTimesValue.get === "function"
        ? pointTimesValue.get(Cesium.JulianDate.now())
        : pointTimesValue;

    // 优先使用 GeoJSON 中保存的真实 SRT 时间索引。
    // 如果当前 3D GeoJSON 是旧版本生成的、没有 point_times，
    // 则根据轨迹段首尾时间和点数建立等比例时间索引，保证仍可点击播放。
    if (!Array.isArray(pointTimes) || pointTimes.length !== positions.length) {
        const startValue = entity.properties.video_start;
        const endValue = entity.properties.video_end;

        const start = startValue && typeof startValue.get === "function"
            ? Number(startValue.get(Cesium.JulianDate.now()))
            : Number(startValue);

        const end = endValue && typeof endValue.get === "function"
            ? Number(endValue.get(Cesium.JulianDate.now()))
            : Number(endValue);

        if (
            Number.isFinite(start) &&
            Number.isFinite(end) &&
            positions.length >= 2 &&
            end >= start
        ) {
            const duration = end - start;
            pointTimes = positions.map(
                (_, i) => start + duration * i / (positions.length - 1)
            );
        }
    }

    if (!Array.isArray(pointTimes) || pointTimes.length !== positions.length) {
        show(mapNotice, "This track has no time index, so the video cannot be located.", true);
        return;
    }

    let bestIndex = 0;
    let bestDistance = Infinity;

    for (let i = 0; i < positions.length; i++) {
        const canvasPoint =
            Cesium.SceneTransforms.worldToWindowCoordinates(
                viewer.scene,
                positions[i]
            );

        if (!canvasPoint) {
            continue;
        }

        const dx = canvasPoint.x - movement.position.x;
        const dy = canvasPoint.y - movement.position.y;
        const distance = dx * dx + dy * dy;

        if (distance < bestDistance) {
            bestDistance = distance;
            bestIndex = i;
        }
    }

    const pointTime = Number(pointTimes[bestIndex]);
    if (!Number.isFinite(pointTime)) {
        show(mapNotice, "Could not determine the video time for the clicked position.", true);
        return;
    }

    const cartographic =
        Cesium.Cartographic.fromCartesian(
            positions[bestIndex]
        );

    const longitude =
        Cesium.Math.toDegrees(cartographic.longitude);
    const latitude =
        Cesium.Math.toDegrees(cartographic.latitude);
    const height =
        cartographic.height;

    showEntityInfo(
        entity,
        pointTime,
        latitude,
        longitude,
        height
    );

    openVideoAt(
        entity,
        bestIndex,
        pointTime,
        latitude,
        longitude,
        height
    );
}

function initViewer() {

    if (viewer) {
        return;
    }

    viewer =
        new Cesium.Viewer(
            "cesiumContainer",
            {
                baseLayerPicker: false,
                geocoder: false,
                homeButton: true,
                sceneModePicker: true,
                navigationHelpButton: true,
                animation: false,
                timeline: false,
                fullscreenButton: true,
                infoBox: false,
                selectionIndicator: false,

                baseLayer:
                    new Cesium.ImageryLayer(
                        new Cesium.UrlTemplateImageryProvider({
                            url:
                                "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                            credit:
                                "© Esri",
                            enablePickFeatures: false
                        })
                    ),

                terrainProvider:
                    new Cesium.EllipsoidTerrainProvider()
            }
        );

    viewer.scene.globe.depthTestAgainstTerrain =
        false;

    viewer.screenSpaceEventHandler.setInputAction(
        handleTrajectoryClick,
        Cesium.ScreenSpaceEventType.LEFT_CLICK
    );

    // 底图使用 ArcGIS World Imagery 卫星影像。
    const baseLayer =
        viewer.imageryLayers.get(0);

    if (baseLayer && baseLayer.errorEvent) {
        baseLayer.errorEvent.addEventListener(
            function (error) {
                console.error(
                    "3D base map error: ",
                    error
                );
                show(
                    mapNotice,
                    "The base map layer failed to load; check the browser console.",
                    true
                );
            }
        );
    }

    viewer.scene.camera.setView({
        destination:
            Cesium.Cartesian3.fromDegrees(
                114.1,
                23.05,
                10000
            )
    });

    viewer.selectedEntityChanged.addEventListener(
        entity => {

            if (!entity) {
                return;
            }

            showEntityInfo(entity);
        }
    );
}

function clearMap() {

    if (!viewer) {
        return;
    }

    for (const entity of entities) {
        viewer.entities.remove(entity);
    }

    entities = [];

    infoPanel.style.display = "none";
    stats.innerHTML = "";
    closeVideo();
}

function showEntityInfo(entity, clickedTime=null, clickedLat=null, clickedLon=null, clickedHeight=null) {

    const p =
        entity.properties;

    if (!p) {
        return;
    }

    const get =
        key => {

            const value =
                p[key];

            if (
                value &&
                typeof value.get === "function"
            ) {
                return value.get(
                    Cesium.JulianDate.now()
                );
            }

            return value;
        };

    const video =
        get("video");

    const segment =
        get("segment_index");

    const start =
        Number(get("video_start"));

    const end =
        Number(get("video_end"));

    const heightType =
        get("height_type");

    const minHeight =
        Number(get("min_height"));

    const maxHeight =
        Number(get("max_height"));

    infoPanel.innerHTML = `
        <div class="info-title">
            3D track info
        </div>

        ${Number.isFinite(Number(clickedTime)) ? `
        <div class="info-row">
            <b>Clicked time: </b>${formatTime(clickedTime)}
        </div>
        <div class="info-row">
            <b>Clicked position: </b>${Number(clickedLon).toFixed(6)}, ${Number(clickedLat).toFixed(6)}
        </div>
        <div class="info-row">
            <b>Clicked altitude: </b>${Number(clickedHeight).toFixed(2)} m
        </div>` : ""}

        <div class="info-row">
            <b>Video: </b>${esc(video)}
        </div>

        <div class="info-row">
            <b>Segment: </b>${esc(segment)}
        </div>

        <div class="info-row">
            <b>Time: </b>
            ${formatTime(start)}
            →
            ${formatTime(end)}
        </div>

        <div class="info-row">
            <b>Altitude type: </b>
            ${heightType === "relative"
                ? "relative"
                : "absolute"}
        </div>

        <div class="info-row">
            <b>Min altitude: </b>
            ${Number.isFinite(minHeight)
                ? minHeight.toFixed(2) + " m"
                : "-"}
        </div>

        <div class="info-row">
            <b>Max altitude: </b>
            ${Number.isFinite(maxHeight)
                ? maxHeight.toFixed(2) + " m"
                : "-"}
        </div>

        <div class="hint">
            The 3D altitude comes straight from the DJI SRT.
            This version prefers relative altitude and does not convert to terrain elevation.
        </div>
    `;

    infoPanel.style.display = "block";
}

function addGeo3D(data, colorIndex, folderIndex, videoPath) {

    const color =
        [
            Cesium.Color.CYAN,
            Cesium.Color.YELLOW,
            Cesium.Color.LIME,
            Cesium.Color.ORANGE,
            Cesium.Color.MAGENTA,
            Cesium.Color.DODGERBLUE,
            Cesium.Color.RED,
            Cesium.Color.WHITE
        ][colorIndex % 8];

    for (
        const feature of
        (data.features || [])
    ) {

        const coords =
            feature.geometry?.coordinates || [];

        if (coords.length < 2) {
            continue;
        }

        const flat =
            [];

        for (const c of coords) {

            flat.push(
                Number(c[0]),
                Number(c[1]),
                Number(c[2] || 0)
            );
        }

        const positionProperty =
            new Cesium.ConstantProperty(
                Cesium.Cartesian3.fromDegreesArrayHeights(
                    flat
                )
            );

        const entity =
            viewer.entities.add({
                name:
                    feature.properties?.video
                    || "3D track",

                polyline: {
                    positions:
                        positionProperty,

                    width: 5,

                    material:
                        new Cesium.ColorMaterialProperty(
                            color
                        ),

                    clampToGround: false
                },

                properties: {
                    video:
                        feature.properties?.video,

                    segment_index:
                        feature.properties?.segment_index,

                    video_start:
                        feature.properties?.video_start,

                    video_end:
                        feature.properties?.video_end,

                    height_type:
                        feature.properties?.height_type,

                    min_height:
                        feature.properties?.min_height,

                    max_height:
                        feature.properties?.max_height,

                    point_times:
                        feature.properties?.point_times || [],

                    folder_index:
                        folderIndex,

                    video_path:
                        videoPath
                }
            });

        entities.push(entity);
    }
}

function PathForVideo(geojsonPath) {
    const text = String(geojsonPath || "");
    const lastDot = text.lastIndexOf(".");
    if (lastDot < 0) {
        return text + ".MP4";
    }
    return text.slice(0, lastDot) + ".MP4";
}

async function loadOne(index) {

    initViewer();

    clearMap();

    hide(mapNotice);

    try {

        const f =
            geoFiles[index];

        const q =
            new URLSearchParams({
                name:
                    projectSelect.value,

                folder_index:
                    String(f.folder_index),

                path:
                    f.relative_path
            });

        const result =
            await api(
                "/api/project/geo3d?"
                + q.toString()
            );

        addGeo3D(
            result.geojson,
            0,
            Number(f.folder_index),
            String(
                PathForVideo(f.relative_path)
            )
        );

        updateStats(
            [result.geojson]
        );

        if (entities.length) {

            await viewer.zoomTo(
                entities
            );
        }

        document
            .querySelectorAll(".file-item")
            .forEach(
                x => x.classList.remove("active")
            );

        document
            .querySelector(
                `.file-item[data-index="${index}"]`
            )
            ?.classList.add("active");

    } catch (error) {

        show(
            mapNotice,
            error.message,
            true
        );
    }
}

async function loadAll() {

    initViewer();

    clearMap();

    hide(mapNotice);

    if (!geoFiles.length) {

        show(
            mapNotice,
            "This project has no loadable 3D GeoJSON.",
            true
        );

        return;
    }

    loadAllBtn.disabled = true;
    loadAllBtn.textContent =
        "Loading…";

    try {

        const datas = [];

        for (
            let i = 0;
            i < geoFiles.length;
            i++
        ) {

            const f =
                geoFiles[i];

            const q =
                new URLSearchParams({
                    name:
                        projectSelect.value,

                    folder_index:
                        String(f.folder_index),

                    path:
                        f.relative_path
                });

            const result =
                await api(
                    "/api/project/geo3d?"
                    + q.toString()
                );

            datas.push(
                result.geojson
            );

            addGeo3D(
                result.geojson,
                i,
                Number(f.folder_index),
                PathForVideo(f.relative_path)
            );
        }

        updateStats(datas);

        if (entities.length) {

            await viewer.zoomTo(
                entities
            );
        }

    } catch (error) {

        show(
            mapNotice,
            error.message,
            true
        );

    } finally {

        loadAllBtn.disabled = false;
        loadAllBtn.textContent =
            "Load all 3D tracks";
    }
}

function updateStats(datas) {

    let records = 0;
    let segments = 0;
    let features = 0;

    datas.forEach(
        data => {

            const p =
                data.properties || {};

            records +=
                Number(
                    p.record_count || 0
                );

            segments +=
                Number(
                    p.segment_count || 0
                );

            features +=
                (data.features || [])
                .length;
        }
    );

    stats.innerHTML = `
        <div class="stat">
            <div class="stat-title">
                3D GeoJSON
            </div>
            <div class="stat-value">
                ${datas.length}
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                Segments
            </div>
            <div class="stat-value">
                ${segments}
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                Features
            </div>
            <div class="stat-value">
                ${features}
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                3D position records
            </div>
            <div class="stat-value">
                ${records.toLocaleString()}
            </div>
        </div>
    `;
}

async function scanFiles() {

    hide(fileNotice);

    try {

        const q =
            new URLSearchParams({
                name:
                    projectSelect.value
            });

        const result =
            await api(
                "/api/project/geojson-list?"
                + q.toString()
            );

        /*
         * 只把普通 .geojson 当作来源文件。
         * .3d.geojson 是本页面自己生成的结果，不重复作为输入。
         */
        geoFiles =
            (result.files || [])
            .filter(
                f =>
                    !f.file_name
                        .toLowerCase()
                        .endsWith(".3d.geojson")
            );

        fileList.innerHTML = "";

        if (!geoFiles.length) {

            show(
                fileNotice,
                "This project has no GeoJSON. Extract the SRT and make GeoJSON on the Video Inspector page first.",
                true
            );

            return;
        }

        for (
            let i = 0;
            i < geoFiles.length;
            i++
        ) {

            const f =
                geoFiles[i];

            const item =
                document.createElement("div");

            item.className =
                "file-item";

            item.dataset.index =
                String(i);

            item.innerHTML = `
                <div>
                    <div class="file-name">
                        ${esc(f.file_name)}
                    </div>

                    <div class="file-meta">
                        ${esc(f.folder_name)}
                        ·
                        Records
                        ${Number(
                            f.record_count || 0
                        ).toLocaleString()}
                        ·
                        Segments
                        ${esc(
                            f.segment_count ?? "-"
                        )}
                    </div>
                </div>

                <button class="secondary">
                    Load 3D
                </button>
            `;

            item
                .querySelector("button")
                .addEventListener(
                    "click",
                    event => {
                        event.stopPropagation();
                        loadOne(i);
                    }
                );

            item.addEventListener(
                "click",
                () => loadOne(i)
            );

            fileList.appendChild(item);
        }

    } catch (error) {

        show(
            fileNotice,
            error.message,
            true
        );
    }
}

async function loadProjects() {

    try {

        const result =
            await api(
                "/api/project/list"
            );

        projectSelect.innerHTML = "";

        const projects =
            result.projects || [];

        if (!projects.length) {

            show(
                projectNotice,
                "No project selected.",
                true
            );

            return;
        }

        projects.forEach(
            project => {

                const option =
                    document.createElement("option");

                option.value =
                    project.name;

                option.textContent =
                    project.name;

                projectSelect.appendChild(
                    option
                );
            }
        );

        show(
            projectNotice,
            "Project: "
            + projectSelect.value
        );

        await scanFiles();

    } catch (error) {

        show(
            projectNotice,
            error.message,
            true
        );
    }
}

projectSelect.addEventListener(
    "change",
    async () => {

        show(
            projectNotice,
            "Project: "
            + projectSelect.value
        );

        await scanFiles();
    }
);

refreshBtn.addEventListener(
    "click",
    scanFiles
);

loadAllBtn.addEventListener(
    "click",
    loadAll
);

clearBtn.addEventListener(
    "click",
    clearMap
);

videoClose.addEventListener(
    "click",
    closeVideo
);

videoModal.addEventListener(
    "click",
    event => {
        if (event.target === videoModal) {
            closeVideo();
        }
    }
);

initViewer();
loadProjects();
</script>

</body>
</html>
