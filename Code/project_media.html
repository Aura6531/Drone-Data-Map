<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Media Inspector</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #f3f5f7;

            color: #111827;

            font-family:
                "Microsoft YaHei",
                "Segoe UI",
                Arial,
                sans-serif;
        }


        .header {

            height: 78px;

            background: #1f2937;

            color: white;

            display: flex;

            align-items: center;

            padding: 0 36px;
        }


        .header-title {

            font-size: 27px;

            font-weight: 700;
        }


        .container {

            max-width: 1500px;

            margin: 0 auto;

            padding: 36px 24px 80px;
        }


        .card {

            background: white;

            border-radius: 14px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.06);

            padding: 34px;

            margin-bottom: 26px;
        }


        h1 {

            margin: 0 0 10px;

            font-size: 30px;
        }


        h2 {

            margin: 0 0 24px;

            font-size: 26px;
        }


        .description {

            color: #64748b;

            font-size: 18px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        .form-label {

            display: block;

            margin-bottom: 10px;

            font-size: 18px;

            font-weight: 700;
        }


        select {

            width: 100%;

            height: 58px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            padding: 0 18px;

            background: white;

            font-size: 17px;
        }


        .current-project {

            margin-top: 18px;

            padding: 18px 20px;

            background: #ecfdf5;

            border:
                1px solid #a7f3d0;

            border-radius: 9px;

            color: #047857;

            font-size: 18px;
        }


        .summary {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 14px;

            margin-top: 25px;
        }


        .summary-item {

            padding: 22px;

            border:
                1px solid #e2e8f0;

            border-radius: 10px;

            background: #f8fafc;
        }


        .summary-label {

            color: #64748b;

            font-size: 15px;

            margin-bottom: 8px;
        }


        .summary-value {

            font-size: 28px;

            font-weight: 700;
        }


        .toolbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;
        }


        .button {

            height: 50px;

            padding: 0 24px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;
        }


        .button:hover {

            background: #1d4ed8;
        }


        .button:disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        .folder-block {

            margin-bottom: 26px;

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            overflow: hidden;
        }


        .folder-header {

            padding: 20px;

            background: #f8fafc;

            border-bottom:
                1px solid #e2e8f0;
        }


        .folder-name {

            font-size: 20px;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .folder-path {

            color: #64748b;

            font-size: 14px;

            word-break: break-all;
        }


        .video-list {

            padding: 12px 20px;
        }


        .video-item {

            padding: 18px 0;

            border-bottom:
                1px solid #eef2f7;
        }


        .video-item:last-child {

            border-bottom: none;
        }


        .video-name {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 10px;

            word-break: break-all;
        }


        .video-meta {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 8px;

            word-break: break-all;
        }


        .status {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 6px;

            font-size: 14px;

            font-weight: 600;
        }


        .status-matched {

            background: #dcfce7;

            color: #15803d;
        }


        .status-missing {

            background: #fef3c7;

            color: #b45309;
        }


        .status-other {

            background: #e2e8f0;

            color: #475569;
        }


        .message {

            display: none;

            margin-top: 18px;

            padding: 17px;

            border-radius: 9px;

            font-size: 16px;
        }


        .message.error {

            display: block;

            color: #dc2626;

            background: #fef2f2;

            border:
                1px solid #fecaca;
        }


        .message.loading {

            display: block;

            color: #1d4ed8;

            background: #eff6ff;

            border:
                1px solid #bfdbfe;
        }


        .empty {

            padding: 35px;

            text-align: center;

            color: #94a3b8;

            border:
                1px dashed #cbd5e1;

            border-radius: 10px;
        }


        @media (max-width: 900px) {

            .summary {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .toolbar {

                flex-direction: column;

                align-items: stretch;
            }
        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-title">
        Drone Survey Data
    </div>

</header>


<main class="container">


    <!-- =====================================================
         项目
         ===================================================== -->

    <section class="card">

        <h1>
            Project media
        </h1>

        <div class="description">

            Reads the data folders of the current project,
            finds drone videos and their matching external SRT telemetry files.

        </div>


        <label
            class="form-label"
            for="projectSelect"
        >
            Select project
        </label>


        <select id="projectSelect">

            <option value="">
                Reading projects…
            </option>

        </select>


        <div
            id="currentProject"
            class="current-project"
        >
            Project: none selected
        </div>


        <div
            id="message"
            class="message"
        >
        </div>

    </section>



    <!-- =====================================================
         统计
         ===================================================== -->

    <section class="card">

        <div class="toolbar">

            <h2>
                Media summary
            </h2>

            <button
                id="refreshButton"
                class="button"
            >
               Rescan
            </button>

        </div>


        <div class="summary">

            <div class="summary-item">

                <div class="summary-label">
                    Data folders
                </div>

                <div
                    id="folderCount"
                    class="summary-value"
                >
                    0
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    Videos
                </div>

                <div
                    id="videoCount"
                    class="summary-value"
                >
                    0
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    External SRT
                </div>

                <div
                    id="srtCount"
                    class="summary-value"
                >
                    0
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    Matched
                </div>

                <div
                    id="matchedCount"
                    class="summary-value"
                >
                    0
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    Pending
                </div>

                <div
                    id="pendingCount"
                    class="summary-value"
                >
                    0
                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         视频列表
         ===================================================== -->

    <section class="card">

        <h2>
            Video file
        </h2>


        <div id="videoContainer">

            <div class="empty">
                No data.
            </div>

        </div>

    </section>


</main>


<script>


    const projectSelect =
        document.getElementById(
            "projectSelect"
        );


    const currentProject =
        document.getElementById(
            "currentProject"
        );


    const refreshButton =
        document.getElementById(
            "refreshButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const folderCount =
        document.getElementById(
            "folderCount"
        );


    const videoCount =
        document.getElementById(
            "videoCount"
        );


    const srtCount =
        document.getElementById(
            "srtCount"
        );


    const matchedCount =
        document.getElementById(
            "matchedCount"
        );


    const pendingCount =
        document.getElementById(
            "pendingCount"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    // ========================================================
    // 启动
    // ========================================================

    loadProjects();


    // ========================================================
    // 项目列表
    // ========================================================

    async function loadProjects() {

        try {

            const response =
                await fetch(
                    "/api/project/list"
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Could not read the project list."
                );
            }


            projectSelect.innerHTML =
                "";


            if (
                !data.projects ||
                data.projects.length === 0
            ) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = "";

                option.textContent =
                    "No projects";

                projectSelect.appendChild(
                    option
                );

                return;
            }


            data.projects.forEach(
                project => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        project.name;

                    option.textContent =
                        project.name;

                    projectSelect.appendChild(
                        option
                    );
                }
            );


            projectSelect.selectedIndex =
                0;


            await analyzeProject();

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );
        }
    }


    // ========================================================
    // 项目切换
    // ========================================================

    projectSelect.addEventListener(
        "change",
        analyzeProject
    );


    refreshButton.addEventListener(
        "click",
        analyzeProject
    );


    // ========================================================
    // 分析项目
    // ========================================================

    async function analyzeProject() {

        const projectName =
            projectSelect.value;


        if (!projectName) {

            currentProject.textContent =
                "Project: none selected";

            resetSummary();

            videoContainer.innerHTML =
                '<div class="empty">No data.</div>';

            return;
        }


        currentProject.textContent =
            "Project: " + projectName;


        refreshButton.disabled =
            true;

        refreshButton.textContent =
            "Scanning…";


        showMessage(
            "Reading project data…",
            "loading"
        );


        try {

            const response =
                await fetch(
                    "/api/project/media?name="
                    +
                    encodeURIComponent(
                        projectName
                    )
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Media scan failed."
                );
            }


            renderResult(
                data
            );


            hideMessage();

        } catch (error) {

            resetSummary();

            videoContainer.innerHTML =
                '<div class="empty">Could not read media data.</div>';


            showMessage(
                error.message,
                "error"
            );

        } finally {

            refreshButton.disabled =
                false;

            refreshButton.textContent =
                "Rescan";
        }
    }


    // ========================================================
    // 显示结果
    // ========================================================

    function renderResult(
        data
    ) {

        folderCount.textContent =
            data.folder_count;


        videoCount.textContent =
            data.video_count;


        srtCount.textContent =
            data.srt_count;


        matchedCount.textContent =
            data.matched_count;


        pendingCount.textContent =
            data.pending_count;


        videoContainer.innerHTML =
            "";


        if (
            !data.folders ||
            data.folders.length === 0
        ) {

            videoContainer.innerHTML =
                '<div class="empty">This project has no data folders.</div>';

            return;
        }


        data.folders.forEach(
            folder => {

                const block =
                    document.createElement(
                        "div"
                    );


                block.className =
                    "folder-block";


                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "folder-header";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "folder-name";


                name.textContent =
                    folder.name;


                const path =
                    document.createElement(
                        "div"
                    );


                path.className =
                    "folder-path";


                path.textContent =
                    folder.path;


                header.appendChild(
                    name
                );

                header.appendChild(
                    path
                );


                block.appendChild(
                    header
                );


                const list =
                    document.createElement(
                        "div"
                    );


                list.className =
                    "video-list";


                if (
                    !folder.videos ||
                    folder.videos.length === 0
                ) {

                    const empty =
                        document.createElement(
                            "div"
                        );


                    empty.className =
                        "empty";


                    empty.textContent =
                        "No videos found in this folder.";


                    list.appendChild(
                        empty
                    );

                } else {

                    folder.videos.forEach(
                        video => {

                            list.appendChild(
                                createVideoItem(
                                    video
                                )
                            );
                        }
                    );
                }


                block.appendChild(
                    list
                );


                videoContainer.appendChild(
                    block
                );
            }
        );
    }


    // ========================================================
    // 视频项目
    // ========================================================

    function createVideoItem(
        video
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "video-item";


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "video-name";


        name.textContent =
            video.name;


        item.appendChild(
            name
        );


        const meta =
            document.createElement(
                "div"
            );


        meta.className =
            "video-meta";


        meta.textContent =
            "Size: "
            +
            formatSize(
                video.size
            )
            +
            "  Relative path: "
            +
            video.relative_path;


        item.appendChild(
            meta
        );


        const status =
            document.createElement(
                "span"
            );


        status.className =
            "status";


        if (video.srt) {

            status.classList.add(
                "status-matched"
            );


            status.textContent =
                "✓ Matching SRT found: "
                +
                video.srt.name;

        } else {

            status.classList.add(
                "status-missing"
            );


            status.textContent =
                "No matching external SRT";
        }


        item.appendChild(
            status
        );


        return item;
    }


    // ========================================================
    // 统计重置
    // ========================================================

    function resetSummary() {

        folderCount.textContent =
            "0";

        videoCount.textContent =
            "0";

        srtCount.textContent =
            "0";

        matchedCount.textContent =
            "0";

        pendingCount.textContent =
            "0";
    }


    // ========================================================
    // 消息
    // ========================================================

    function showMessage(
        text,
        type
    ) {

        message.className =
            "message "
            +
            type;

        message.textContent =
            text;
    }


    function hideMessage() {

        message.className =
            "message";

        message.textContent =
            "";
    }


    // ========================================================
    // 文件大小
    // ========================================================

    function formatSize(
        bytes
    ) {

        if (
            bytes === null ||
            bytes === undefined
        ) {

            return "0 B";
        }


        if (bytes < 1024) {

            return bytes + " B";
        }


        if (
            bytes <
            1024 * 1024
        ) {

            return (
                (bytes / 1024)
                .toFixed(1)
                +
                " KB"
            );
        }


        if (
            bytes <
            1024 * 1024 * 1024
        ) {

            return (
                (bytes / 1024 / 1024)
                .toFixed(1)
                +
                " MB"
            );
        }


        return (
            (bytes / 1024 / 1024 / 1024)
            .toFixed(2)
            +
            " GB"
        );
    }


</script>

</body>

</html>
